<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pigiausias Kuras</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007AFF">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts imported in styles.css -->
    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🚧 Pigiausias Kuras 🚧</h1>
            <p>Raskite geriausią kainą savo mieste</p>
        </header>

        <main class="app-content">
            <section class="controls">
                <div class="input-group">
                    <label for="city-select">Įveskite lokaciją, arba nustatykite pagal Gps</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="city-select" style="flex: 1;">
                            <option value="Vilnius">Vilnius</option>
                            <option value="Kaunas">Kaunas</option>
                            <option value="Klaipėda">Klaipėda</option>
                        </select>
                        <button id="use-gps-btn" class="fuel-btn"
                            style="flex: 0 0 auto; padding: 0 16px; background: var(--danger-color); color: #111; font-weight: bold; border: 2px solid #111; border-radius: var(--border-radius); font-size: 16px; box-shadow: 2px 2px 0 #111;"
                            title="Rasti pagal GPS">GPS</button>
                        <button id="open-settings-btn" class="fuel-btn"
                            style="flex: 0 0 auto; padding: 0 12px; background: #333; color: white; border: 2px solid #111; border-radius: var(--border-radius); font-size: 20px; box-shadow: 2px 2px 0 #111;"
                            title="Nustatymai">⚙️</button>
                    </div>
                </div>

                <div class="input-group" id="address-input-group">
                    <label for="address-input">Tikslesniam atstumui – įveskite adresą (nebūtina)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="address-input" class="text-input" placeholder="Pvz. Laisvės al. 1">
                        <button id="search-address-btn" class="fuel-btn"
                            style="flex: 0 0 auto; padding: 0 16px; background: #333; color: var(--primary-color); border: 2px solid #111; border-radius: var(--border-radius); font-size: 16px; box-shadow: 2px 2px 0 #111;"
                            title="Ieškoti adreso">🔍</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="radius-select">Paieškos spindulys</label>
                    <select id="radius-select">
                        <option value="1">1Km spinduliu</option>
                        <option value="2">2Km spinduliu</option>
                        <option value="3">3Km spinduliu</option>
                        <option value="5">5Km spinduliu</option>
                        <option value="10">10Km spinduliu</option>
                        <option value="all" selected>Rodyti viską (Visas miestas)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Degalinių tinklai</label>
                    <div class="custom-select-container">
                        <div class="custom-select-header" id="network-dropdown-btn">
                            <span id="network-dropdown-text">Visi tinklai</span>
                            <span class="dropdown-icon">▼</span>
                        </div>
                        <div class="custom-select-options hidden" id="network-dropdown-options">
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="all" checked>
                                Visi</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="Circle K">
                                Circle K</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="Neste">
                                Neste</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="Viada">
                                Viada</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb"
                                    value="Baltic Petroleum"> Baltic Petroleum</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="Emsi">
                                Emsi</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="Jozita">
                                Jozita</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="Saurida">
                                Saurida</label>
                            <label class="custom-option"><input type="checkbox" class="network-cb" value="Orlen">
                                Orlen</label>
                        </div>
                    </div>
                </div>



                <button id="find-cheapest-btn" class="primary-btn hidden">Rasti arčiausią ir pigiausią</button>
            </section>

            <section id="results-container" class="results-section hidden">
                <h2>Pigiausia degalinė:</h2>
                <div id="cheapest-card" class="result-card highlight">
                    <!-- Javascript will populate this -->
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                    <h3 class="other-options-title" style="margin: 0;">Degalinės:</h3>
                    <button id="toggle-view-btn" class="fuel-btn"
                        style="padding: 6px 12px; font-size: 12px; flex: none; width: auto; background: #333; color: var(--primary-color); border: 2px solid #111; border-radius: var(--border-radius); box-shadow: 2px 2px 0 #111;">Rodyti
                        sąrašą</button>
                </div>
                <div id="map"
                    style="height: 400px; width: 100%; border-radius: var(--border-radius); border: var(--border-style); margin-top: 10px; box-shadow: 4px 4px 0px #000; z-index: 1;">
                    <!-- Leaflet map will render here -->
                </div>
                <div id="other-stations-list" class="stations-list hidden" style="margin-top: 10px;">
                    <!-- Javascript will populate this -->
                </div>
            </section>
        </main>
        
        <footer class="app-footer">
            <p>Duomenys: Lietuvos Energetikos Agentūra (LEA).<br>Visos teisės saugomos &copy; 2026</p>
        </footer>
    </div>
    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ Nustatymai</h2>
                <button id="close-settings-btn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3>Kuro tipas</h3>
                    <div class="fuel-buttons" id="fuel-type-container">
                        <button class="fuel-btn active" data-type="A95">A95</button>
                        <button class="fuel-btn" data-type="Diesel">Dyzelinas</button>
                        <button class="fuel-btn" data-type="LPG">Dujos (LPG)</button>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Navigacija</h3>
                    <select id="nav-app-select" class="text-input" style="width: 100%;">
                        <option value="google">Google Maps</option>
                        <option value="waze">Waze</option>
                    </select>
                </div>

                <div class="settings-section">
                    <h3>Skaičiavimo režimas</h3>
                    <div class="radio-group" id="calc-mode-group">
                        <label class="radio-label"><input type="radio" name="calc-mode" value="with_discount" checked> Skaičiuoti su nuolaida</label>
                        <label class="radio-label"><input type="radio" name="calc-mode" value="no_discount"> Rodyti be nuolaidos</label>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>Tinklų Nuolaidos (ct/l)</h3>
                    <div id="discounts-container" class="discounts-list">
                        <!-- Javascript will populate this -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-settings-btn" class="primary-btn">Išsaugoti</button>
            </div>
        </div>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('ServiceWorker registered'))
                    .catch(error => console.log('ServiceWorker registration failed: ', error));
            });
        }
    </script>
</body>

</html>
