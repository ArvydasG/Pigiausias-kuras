name: Atnaujinti Kuro Kainas

on:
  schedule:
    # Paleidžiama kiekvieną dieną 10:15, 12:00, 14:00, 16:00, 18:00 Lietuvos laiku (UTC yra 3 valandom atgal)
    - cron: '15 7 * * *'
    - cron: '0 9,11,13,15 * * *'
  workflow_dispatch: # Leidžia paleisti rankiniu būdu iš GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Atsisiųsti repozitorijos failus
      uses: actions/checkout@v4

    - name: Paruošti Python aplinką
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Įdiegti bibliotekas
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Paleisti duomenų siurbimo skriptą
      run: python scraper.py
      
    - name: Išsaugoti pakeitimus (Commit)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.js coords_cache.json
        # Patikriname ar yra pakeitimų, jei taip - išsaugome
        git diff --quiet && git diff --staged --quiet || git commit -m "Automatinis kuro kainų atnaujinimas"
        git push
