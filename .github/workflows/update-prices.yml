name: Automatinis kuro kainu atnaujinimas
on:
  schedule:
    # Kasdien 10:30 valandą Lietuvos laiku (07:30 UTC vasaros laiku)
    - cron: '25 7 * * *'
  workflow_dispatch: # Leidžia paleisti veiksmą rankiniu būdu iš GitHub
permissions:
  contents: write # Leidimas išsaugoti failus atgal į repozitoriją
jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
    - name: Atsisiųsti kodo kopiją (Checkout repo)
      uses: actions/checkout@v3
    - name: Paruošti Python aplinką
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Įdiegti bibliotekas
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 openpyxl
    - name: Paleisti duomenų siurbimą
      run: |
        python scraper.py
        
    - name: Išsaugoti pakeitimus (Commit and Push)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.js coords_cache.json
        git commit -m "Automatinis kainų atnaujinimas iš LEA" || echo "Nėra jokių pakeitimų"
        git push
