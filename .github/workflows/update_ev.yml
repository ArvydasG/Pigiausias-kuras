name: Automatinis EV stoteliu atnaujinimas

on:
  schedule:
    # Kas valandą visą parą
    - cron: '0 * * * *'
  workflow_dispatch: # Leidžia paleisti veiksmą rankiniu būdu iš GitHub

permissions:
  contents: write # Leidimas išsaugoti failus atgal į repozitoriją

jobs:
  update-ev-prices:
    runs-on: ubuntu-latest

    steps:
    - name: Atsisiųsti kodo kopiją (Checkout repo)
      uses: actions/checkout@v3

    - name: Paruošti Python aplinką
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Įdiegti bibliotekas
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz

    - name: Paleisti EV duomenų siurbimą
      run: |
        python scraper_ev.py
        
    - name: Išsaugoti pakeitimus (Commit and Push)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data_ev.js
        git commit -m "Automatinis EV stotelių atnaujinimas iš Via Lietuva" || echo "Nėra jokių pakeitimų"
        git push
