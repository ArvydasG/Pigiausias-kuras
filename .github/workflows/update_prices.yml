name: Automatinis kuro kainu atnaujinimas

on:
  schedule:
    # Kas valandą visą parą
    - cron: '0 * * * *'
  workflow_dispatch: # Leidžia paleisti veiksmą rankiniu būdu iš GitHub

permissions:
  contents: write # Leidimas išsaugoti failus atgal į repozitoriją

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
    - name: Atsisiųsti kodo kopiją (Checkout repo)
      uses: actions/checkout@v3

    - name: Paruošti Python aplinką
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Įdiegti bibliotekas
      run: |
        python -m pip install --upgrade pip
        pip install requests playwright
        playwright install chromium --with-deps

    - name: Paleisti degalų duomenų siurbimą
      run: |
        python scraper.py
        
    - name: Paleisti sunkvežimių (TIR) aikštelių atnaujinimą
      run: |
        python fetch_hgv.py

    - name: Išsaugoti pakeitimus (Commit and Push)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.js data_hgv.js
        git commit -m "Automatinis duomenų atnaujinimas (Degalai + HGV)" || echo "Nėra jokių pakeitimų"
        git push
